name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            node: '24.22.1'
          - python: '3.12'
            node: '26.12.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install test dependencies
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Contribution-check tests
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Core and OpenClaw fixture tests
        run: python -m unittest discover -s hermes-owner-mode/tests
      - name: Installed wheel setup resources
        if: matrix.python == '3.12'
        env:
          PIP_NO_INDEX: '1'
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python tools/package_assets.py --check
          python -m unittest discover -s packaging -p 'test_*.py'
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/flashalign-wheel" .
          python packaging/check_wheel.py "$RUNNER_TEMP"/flashalign-wheel/aevonix_flashalign-*.whl
      - name: Shared engine gate and replay tests
        env:
          PYTHONPATH: engines/common
        run: python -m unittest discover -s engines/tests
      - name: SGLang lifecycle protocol tests
        run: python -m unittest discover -s engines/common -p test_sglang_lifecycle.py
      - name: Portable benchmark evidence
        if: matrix.python == '3.12'
        working-directory: benchmarks/evidence/qwen-sglang-20261101
        run: |
          python -B -S recompute.py
          python -B -S -m unittest -q test_recompute
      - name: Install CPU tensor test dependency
        if: matrix.python == '3.12'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.13.0+cpu'
          python -m pip install 'safetensors==0.8.0'
      - name: Verify CPU tensor test dependency
        if: matrix.python == '3.12'
        run: python -c "import torch, safetensors; assert torch.__version__ == '2.13.0+cpu'; assert safetensors.__version__ == '0.8.0'"
      - name: Projection generation and failed-hook rollback tests
        if: matrix.python == '3.12'
        env:
          PYTHONPATH: engines/vllm
          CUDA_VISIBLE_DEVICES: ''
        run: python -m pytest -q engines/vllm/tests/test_generations.py
      - name: SGLang graph-generation contract tests
        if: matrix.python == '3.12'
        env:
          PYTHONPATH: engines/sglang
          CUDA_VISIBLE_DEVICES: ''
        run: python -m pytest -q engines/sglang/tests/test_graph_contract.py
      - name: Native DeepSeek contract and lifecycle tests
        run: python -m pytest -q engines/vllm-deepseek-native/tests
      - name: Shell and JavaScript syntax
        run: |
          bash -n install.sh
          for file in openclaw-owner-mode/*.mjs; do
            node --check "$file"
          done
