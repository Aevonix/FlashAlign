[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
classifiers = ["License :: OSI Approved :: GNU Affero General Public License v3"]
name = "flashalign-vllm"
version = "0.1.0"
description = "Pinned FlashAlign request-time profile integration for vLLM"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["safetensors>=0.4"]

[project.entry-points."vllm.general_plugins"]
flashalign = "flashalign_vllm.plugin:register"

[project.scripts]
flashalign-vllm = "flashalign_vllm.cli:main"

[tool.setuptools.packages.find]
include = ["flashalign_vllm*"]
